<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0a0d14"
    >

    <title>Seek AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                S
            </div>

            <div class="brand-name">
                Seek AI
            </div>

        </div>


        <button
            id="newChat"
            class="new-chat"
            type="button">
            New Chat
        </button>


        <div class="section-title">
            Chats
        </div>


        <div
            id="chatHistory"
            class="chat-history">
        </div>


        <div
            id="accountArea"
            style="margin-top:10px;">
        </div>


        <div class="account-area">

    <button
        id="googleLoginButton"
        class="google-login"
        type="button">
        Continue with Google
    </button>

    <div
        id="accountInfo"
        class="account-info">
    </div>

</div>
        <div class="sidebar-bottom">

            <button
                id="themeButton"
                class="side-button"
                type="button">
                Light Mode
            </button>


            <button
                id="memoryButton"
                class="side-button"
                type="button">
                Memory
            </button>


            <button
                id="voiceButton"
                class="side-button"
                type="button">
                Voice: ON
            </button>


            <button
                id="deleteAllChats"
                class="side-button danger"
                type="button">
                Delete All Chats
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="mobile-brand">

                <div class="brand-logo small">
                    S
                </div>

                <span>
                    Seek AI
                </span>

            </div>


            <div class="topbar-title">
                Seek AI
            </div>


            <select
                id="language"
                aria-label="Language">

                <option value="English">English</option>
                <option value="Persian">فارسی</option>
                <option value="Arabic">العربية</option>
                <option value="Spanish">Español</option>
                <option value="French">Français</option>
                <option value="German">Deutsch</option>
                <option value="Italian">Italiano</option>
                <option value="Portuguese">Português</option>
                <option value="Russian">Русский</option>
                <option value="Chinese">中文</option>
                <option value="Japanese">日本語</option>
                <option value="Korean">한국어</option>
                <option value="Hindi">हिन्दी</option>
                <option value="Turkish">Türkçe</option>
                <option value="Dutch">Nederlands</option>
                <option value="Polish">Polski</option>
                <option value="Ukrainian">Українська</option>
                <option value="Greek">Ελληνικά</option>
                <option value="Hebrew">עברית</option>
                <option value="Indonesian">Bahasa Indonesia</option>
                <option value="Vietnamese">Tiếng Việt</option>
                <option value="Thai">ไทย</option>

            </select>

        </header>


        <section
            id="chat"
            class="chat-area">

            <div class="welcome">

                <div class="welcome-logo">
                    S
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask Seek AI anything.
                </p>


                <div class="suggestions">

                    <button
                        class="suggestion"
                        type="button"
                        data-text="Explain something difficult in a simple way.">
                        Explain something
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        data-text="Write a creative short story.">
                        Write something
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        data-text="Give me creative ideas for a project.">
                        Give me ideas
                    </button>

                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <button
                    id="micButton"
                    class="input-button"
                    type="button">
                    Mic
                </button>


                <input
                    id="message"
                    type="text"
                    placeholder="Message Seek AI..."
                    autocomplete="off"
                    spellcheck="true"
                >


                <button
                    id="send"
                    class="send-button"
                    type="button">
                    Send
                </button>

            </div>


            <div class="input-note">
                Seek AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<div
    id="memoryModal"
    class="modal hidden">

    <div class="modal-card">

        <div class="modal-top">

            <h2>
                Seek AI Memory
            </h2>


            <button
                id="closeMemory"
                type="button">
                Close
            </button>

        </div>


        <div
            id="memoryContent"
            class="memory-content">
            No saved conversations.
        </div>


        <button
            id="clearMemory"
            class="clear-memory"
            type="button">
            Clear Memory
        </button>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        doc,
        setDoc,
        getDocs,
        deleteDoc,
        query,
        where,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDTqf-_-KYFJIh18SZ84ueQnotVP2yf8F8",
        authDomain: "seek-ai-12b21.firebaseapp.com",
        projectId: "seek-ai-12b21",
        storageBucket: "seek-ai-12b21.firebasestorage.app",
        messagingSenderId: "821026461464",
        appId: "1:821026461464:web:298804f8bb69733212f06d",
        measurementId: "G-8FMTF6RYQH"
    };


    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(
            app
        );


    const googleProvider =
        new GoogleAuthProvider();


    const db =
        getFirestore(
            app
        );


    window.firebaseAuth =
        auth;


    window.googleProvider =
        googleProvider;


    window.firebaseDB =
        db;


    window.firebaseTools = {

        signInWithPopup,
        onAuthStateChanged,
        signOut,

        collection,
        doc,
        setDoc,
        getDocs,
        deleteDoc,

        query,
        where,
        orderBy
    };


    window.firebaseReady =
        true;

    window.dispatchEvent(
        new Event("firebaseReady")
    );

</script>


<script src="script.js"></script>

</body>

</html>
